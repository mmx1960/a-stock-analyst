<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票分析 - {{ code }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.35.0/dist/apexcharts.min.js"></script>
    <style>
        :root { --primary: #d32f2f; --success: #2e7d32; --bg-dark: #1a1a2e; }
        body { background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .navbar { background: var(--bg-dark) !important; }
        .navbar-brand { color: #fff !important; font-weight: 700; }
        .up { color: var(--success); } .down { color: var(--primary); }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 1rem; }
        .card-header { background: #fff; border-bottom: 2px solid #eee; font-weight: 600; }
        .grade-A { color: #2e7d32; } .grade-B { color: #1565c0; } .grade-C { color: #f57c00; } .grade-D { color: #d32f2f; } .grade-E { color: #6a1b9a; }
        .score-ring { width: 120px; height: 120px; }
        #loading { display: flex; justify-content: center; align-items: center; height: 60vh; }
        .content { display: none; }
        .metric { text-align: center; padding: 0.5rem; }
        .metric-value { font-size: 1.5rem; font-weight: 700; }
        .metric-label { font-size: 0.8rem; color: #888; }
        .rec-buy { background: #e8f5e9; border-left: 4px solid #2e7d32; }
        .rec-hold { background: #fff3e0; border-left: 4px solid #f57c00; }
        .rec-sell { background: #ffebee; border-left: 4px solid #d32f2f; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-chart-line"></i> A 股分析系统</a>
            <form class="d-flex">
                <input type="text" class="form-control form-control-sm" id="nav-search" placeholder="股票代码" style="width:120px" value="{{ code }}">
                <button class="btn btn-sm btn-outline-light ms-1" onclick="goStock()">分析</button>
            </form>
        </div>
    </nav>

    <div class="container py-4">
        <!-- Loading -->
        <div id="loading">
            <div class="text-center">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-3 text-muted">正在分析 <strong>{{ code }}</strong>...</p>
            </div>
        </div>

        <!-- Content -->
        <div class="content" id="analysis-content">
            <!-- 头部 -->
            <div class="row mb-3">
                <div class="col-md-8">
                    <h3 id="stock-name" class="mb-1">{{ code }}</h3>
                    <div class="d-flex align-items-center gap-3">
                        <span class="fs-2 fw-bold" id="stock-price">--</span>
                        <span class="fs-5" id="stock-change">--</span>
                    </div>
                    <div class="text-muted small" id="update-time"></div>
                </div>
                <div class="col-md-4 text-end">
                    <div id="score-display" class="d-flex justify-content-md-end align-items-center gap-2">
                        <!-- 评分 -->
                    </div>
                </div>
            </div>

            <!-- K 线图 -->
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-chart-bar"></i> K 线走势</span>
                    <div class="btn-group btn-group-sm" role="group">
                        <button type="button" class="btn btn-outline-secondary" data-period="weekly" onclick="switchPeriod('weekly')">周线</button>
                        <button type="button" class="btn btn-outline-secondary active" data-period="daily" onclick="switchPeriod('daily')">日线</button>
                        <button type="button" class="btn btn-outline-secondary" data-period="60" onclick="switchPeriod('60')">60分钟</button>
                        <button type="button" class="btn btn-outline-secondary" data-period="30" onclick="switchPeriod('30')">30分钟</button>
                        <button type="button" class="btn btn-outline-secondary" data-period="15" onclick="switchPeriod('15')">15分钟</button>
                        <button type="button" class="btn btn-outline-secondary" data-period="5" onclick="switchPeriod('5')">5分钟</button>
                    </div>
                </div>
                <div class="card-body">
                    <div id="kline-chart"></div>
                </div>
            </div>

            <!-- 技术指标 + 基本面 + 资金面 -->
            <div class="row">
                <!-- 技术指标 -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header"><i class="fas fa-cogs"></i> 技术指标</div>
                        <div class="card-body" id="tech-indicators"></div>
                    </div>
                </div>
                <!-- 基本面 -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header"><i class="fas fa-building"></i> 基本面</div>
                        <div class="card-body" id="fund-indicators"></div>
                    </div>
                </div>
                <!-- 资金面 -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header"><i class="fas fa-exchange-alt"></i> 资金流向</div>
                        <div class="card-body" id="flow-indicators"></div>
                    </div>
                </div>
            </div>

            <!-- 缠论分析 -->
            <div class="card" id="czsc-section" style="display:none">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-project-diagram"></i> 缠中说禅分析</span>
                    <span class="badge bg-info" id="czsc-period-badge">日线</span>
                </div>
                <div class="card-body">
                    <!-- 买卖点提示 -->
                    <div class="alert" id="czsc-buy-sell-points" style="display:none">
                        <strong><i class="fas fa-bell"></i> 当前级别买卖点：</strong>
                        <div id="czsc-bs-points" class="mt-2"></div>
                    </div>
                    <!-- MACD背离提示 -->
                    <div class="alert" id="czsc-macd-divergence" style="display:none">
                        <strong><i class="fas fa-chart-line"></i> MACD背离信号：</strong>
                        <div id="czsc-divergence-detail" class="mt-2"></div>
                    </div>
                    <div class="row">
                        <div class="col-md-4">
                            <h6><i class="fas fa-wave-square"></i> 笔分析</h6>
                            <div id="czsc-bi"></div>
                        </div>
                        <div class="col-md-4">
                            <h6><i class="fas fa-exchange-alt"></i> 分型分析</h6>
                            <div id="czsc-fx"></div>
                        </div>
                        <div class="col-md-4">
                            <h6><i class="fas fa-bullseye"></i> 趋势判断</h6>
                            <div id="czsc-trend"></div>
                        </div>
                    </div>
                    <hr>
                    <div class="row">
                        <div class="col-md-6">
                            <h6><i class="fas fa-bell"></i> 缠论信号</h6>
                            <div id="czsc-signals"></div>
                        </div>
                        <div class="col-md-6">
                            <h6><i class="fas fa-lightbulb"></i> 分析总结</h6>
                            <div id="czsc-summary"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 评分雷达图 + 建议 -->
            <div class="row">
                <div class="col-md-5">
                    <div class="card">
                        <div class="card-header"><i class="fas fa-bullseye"></i> 综合评分雷达图</div>
                        <div class="card-body">
                            <div id="radar-chart"></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-7">
                    <div class="card">
                        <div class="card-header"><i class="fas fa-robot"></i> AI 分析建议</div>
                        <div class="card-body" id="recommendation"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    const code = "{{ code }}";
    const apiBase = '';
    let currentPeriod = 'daily';
    let klineChart = null;
    let currentAnalysisData = null;

    document.addEventListener('DOMContentLoaded', loadAnalysis);

    function goStock() {
        const c = document.getElementById('nav-search').value.trim();
        if (c) window.location.href = `/stock/${c}`;
    }

    function switchPeriod(period) {
        currentPeriod = period;
        // 更新按钮状态
        document.querySelectorAll('[data-period]').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.period === period);
        });
        // 更新缠论级别标签
        const periodLabels = { 'weekly': '周线', 'daily': '日线', '60': '60分钟', '30': '30分钟', '15': '15分钟', '5': '5分钟' };
        document.getElementById('czsc-period-badge').textContent = periodLabels[period] || period;
        // 重新加载数据
        loadKlineAndCZSC();
    }

    async function loadAnalysis() {
        try {
            const analysisRes = await fetch(`${apiBase}/api/analysis/${code}`);
            if (!analysisRes.ok) throw new Error('分析数据获取失败');
            currentAnalysisData = await analysisRes.json();
            renderAnalysis(currentAnalysisData);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('analysis-content').style.display = 'block';
            // 加载K线和缠论
            await loadKlineAndCZSC();
        } catch (e) {
            document.getElementById('loading').innerHTML = `<div class="text-center text-danger"><i class="fas fa-exclamation-triangle fa-3x"></i><p class="mt-3">${e.message}</p><a href="/" class="btn btn-primary">返回首页</a></div>`;
        }
    }

    async function loadKlineAndCZSC() {
        if (!currentAnalysisData) return;
        try {
            // 并行加载 K 线和缠论
            const [klineRes, czscRes] = await Promise.all([
                fetch(`${apiBase}/api/kline/${code}?period=${currentPeriod}`),
                fetch(`${apiBase}/api/czsc/${code}?period=${currentPeriod}`)
            ]);
            const kline = await klineRes.json().catch(() => []);
            const czsc = await czscRes.json().catch(() => null);
            // 销毁旧图表
            if (klineChart) { klineChart.destroy(); klineChart = null; }
            if (kline.length > 0) renderKlineChart(kline);
            // 渲染对应级别的缠论
            renderCZSC(czsc, currentPeriod);
        } catch (e) {
            console.error('K线/缠论加载失败:', e);
        }
    }

    function renderAnalysis(data, kline) {
        // 基本信息
        document.getElementById('stock-name').textContent = `${data.name} (${data.code})`;
        const priceEl = document.getElementById('stock-price');
        priceEl.textContent = data.price;
        const changeEl = document.getElementById('stock-change');
        const isUp = data.change_pct >= 0;
        changeEl.textContent = `${isUp?'+':''}${data.change_pct.toFixed(2)}%`;
        changeEl.className = `fs-5 ${isUp?'up':'down'}`;
        document.getElementById('update-time').textContent = `数据更新: ${data.updated_at}`;

        // 综合评分
        const comp = data.composite;
        const gradeClass = `grade-${comp.grade}`;
        document.getElementById('score-display').innerHTML = `
            <div class="text-center">
                <div class="score-ring"><div id="score-gauge"></div></div>
                <div class="fs-4 fw-bold ${gradeClass}">${comp.score} 分</div>
                <div class="badge bg-${comp.score>=60?'success':comp.score>=45?'warning':'danger'}">${comp.label} (${comp.grade}级)</div>
            </div>`;
        // 评分仪表盘
        new ApexCharts(document.getElementById('score-gauge'), {
            series: [comp.score],
            chart: { type: 'radialBar', height: 120, animations: { enabled: true } },
            plotOptions: {
                radialBar: {
                    startAngle: -90, endAngle: 90,
                    track: { background: '#eee' },
                    dataLabels: { name: { show: false }, value: { fontSize: '20px', fontWeight: 700, formatter: v => v } }
                }
            },
            colors: [comp.score >= 60 ? '#2e7d32' : comp.score >= 45 ? '#f57c00' : '#d32f2f'],
            stroke: { lineCap: 'round' }
        }).render();

        // K 线图（kline 参数可选，由 loadKlineAndCZSC 负责加载）
        if (kline && kline.length > 0) {
            renderKlineChart(kline);
        }

        // 技术指标
        const tech = data.technical;
        if (tech) {
            const ma = tech.ma;
            const macd = tech.macd;
            const rsi = tech.rsi;
            const boll = tech.boll;
            document.getElementById('tech-indicators').innerHTML = `
                <table class="table table-sm mb-0">
                    <tr><td>MA5</td><td class="text-end">${ma?.ma5||'--'}</td><td>MA20</td><td class="text-end">${ma?.ma20||'--'}</td></tr>
                    <tr><td>MA60</td><td class="text-end">${ma?.ma60||'--'}</td><td>趋势</td><td class="text-end">${tech.trend?.trend||'--'}</td></tr>
                    <tr><td>MACD</td><td class="text-end">${macd?.dif?.toFixed(3)||'--'}</td><td>信号</td><td class="text-end ${macd?.trend==='bullish'?'up':'down'}">${macd?.trend==='bullish'?'金叉':'死叉'}</td></tr>
                    <tr><td>RSI(14)</td><td class="text-end">${rsi?.value||'--'}</td><td>状态</td><td class="text-end">${rsi?.signal||'--'}</td></tr>
                    <tr><td>BOLL上轨</td><td class="text-end">${boll?.upper||'--'}</td><td>下轨</td><td class="text-end">${boll?.lower||'--'}</td></tr>
                    <tr><td>KDJ</td><td class="text-end">${tech.kdj?`K:${tech.kdj.k} D:${tech.kdj.d} J:${tech.kdj.j}`:'--'}</td><td>信号</td><td class="text-end">${tech.kdj?.signal||'--'}</td></tr>
                    <tr><td>量比</td><td class="text-end">${tech.volume_analysis?.volume_ratio||'--'}</td><td>ATR</td><td class="text-end">${tech.atr?.atr_pct||'--'}%</td></tr>
                    <tr><td>支撑位</td><td class="text-end">${tech.support_resistance?.support||'--'}</td><td>压力位</td><td class="text-end">${tech.support_resistance?.resistance||'--'}</td></tr>
                </table>
            `;
        }

        // 基本面
        const fund = data.fundamental;
        if (fund) {
            const s = fund.score || {};
            document.getElementById('fund-indicators').innerHTML = `
                <div class="mb-2">行业: <strong>${fund.industry}</strong> | 地区: ${fund.region}</div>
                <table class="table table-sm mb-0">
                    <tr><td>PE（动态）</td><td class="text-end">${fund.valuation?.pe||'--'}</td><td>评级</td><td class="text-end">${fund.valuation?.pe_rating||'--'}</td></tr>
                    <tr><td>PB</td><td class="text-end">${fund.valuation?.pb||'--'}</td><td>评级</td><td class="text-end">${fund.valuation?.pb_rating||'--'}</td></tr>
                    <tr><td>ROE</td><td class="text-end">${fund.profitability?.roe||'--'}%</td><td>评级</td><td class="text-end">${fund.profitability?.roe_rating||'--'}</td></tr>
                    <tr><td>毛利率</td><td class="text-end">${fund.profitability?.gross_margin||'--'}%</td><td>净利率</td><td class="text-end">${fund.profitability?.net_margin||'--'}%</td></tr>
                </table>
                <div class="mt-2 small text-muted">基本面评分: <strong>${s.total||'--'}/100</strong>
                    (估值${s.breakdown?.valuation||0} + 盈利${s.breakdown?.profitability||0} + 成长${s.breakdown?.growth||0})
                </div>
            `;
        }

        // 资金面
        const flow = data.capital_flow;
        if (flow) {
            const mf = flow.main_flow;
            const s = flow.score || {};
            if (mf) {
                const fmt = (v) => {
                    const n = parseFloat(v) || 0;
                    return n >= 1e8 ? (n/1e8).toFixed(2)+'亿' : n >= 1e4 ? (n/1e4).toFixed(1)+'万' : n.toFixed(0);
                };
                document.getElementById('flow-indicators').innerHTML = `
                    <table class="table table-sm mb-0">
                        <tr><td>主力净流入</td><td class="text-end ${mf.main_net_inflow>=0?'up':'down'}">${fmt(mf.main_net_inflow)}</td></tr>
                        <tr><td>超大单</td><td class="text-end ${mf.super_large_net>=0?'up':'down'}">${fmt(mf.super_large_net)}</td></tr>
                        <tr><td>大单</td><td class="text-end ${mf.large_net>=0?'up':'down'}">${fmt(mf.large_net)}</td></tr>
                        <tr><td>中单</td><td class="text-end">${fmt(flow.retail_flow?.medium_net||0)}</td></tr>
                        <tr><td>小单（散户）</td><td class="text-end">${fmt(flow.retail_flow?.small_net||0)}</td></tr>
                        <tr class="fw-bold"><td>综合信号</td><td class="text-end">${flow.flow_signal}</td></tr>
                    </table>
                    <div class="mt-2 small text-muted">资金面评分: <strong>${s.total||'--'}/100</strong></div>
                `;
            } else {
                document.getElementById('flow-indicators').innerHTML = '<div class="text-muted">资金流向数据暂不可用</div>';
            }
        }

        // 雷达图
        const b = comp.breakdown;
        new ApexCharts(document.getElementById('radar-chart'), {
            series: [{ name: '评分', data: [b.technical||50, b.fundamental||50, b.capital_flow||50, b.technical||50, b.fundamental||50] }],
            chart: { type: 'radar', height: 280 },
            xaxis: { categories: ['技术面', '基本面', '资金面', '趋势', '盈利'] },
            yaxis: { max: 100, min: 0 },
            fill: { opacity: 0.3 },
            markers: { size: 4 },
            colors: ['#1565c0']
        }).render();

        // 建议
        const rec = data.recommendation;
        if (rec) {
            const cls = rec.action === 'BUY' ? 'rec-buy' : rec.action === 'HOLD' ? 'rec-hold' : 'rec-sell';
            const actionText = rec.action === 'BUY' ? '买入' : rec.action === 'HOLD' ? '持有' : '卖出';
            const icon = rec.action === 'BUY' ? 'fa-arrow-up' : rec.action === 'HOLD' ? 'fa-minus' : 'fa-arrow-down';
            document.getElementById('recommendation').innerHTML = `
                <div class="${cls} p-3 rounded">
                    <h5><i class="fas ${icon}"></i> ${actionText} | 置信度: ${rec.confidence === 'high' ? '高' : rec.confidence === 'medium' ? '中' : '低'}</h5>
                    <p>${rec.reason}</p>
                    <hr>
                    <small class="text-muted"><i class="fas fa-shield-alt"></i> ${rec.disclaimer}</small>
                </div>
            `;
        }

        // 缠论分析
        renderCZSC(data.czsc);
    }

    function renderCZSC(czsc, period = 'daily') {
        const section = document.getElementById('czsc-section');
        if (!czsc || !czsc.available) { section.style.display = 'none'; return; }
        section.style.display = 'block';

        // 更新级别标签
        const periodLabels = { 'weekly': '周线', 'daily': '日线', '60': '60分钟', '30': '30分钟', '15': '15分钟', '5': '5分钟' };
        document.getElementById('czsc-period-badge').textContent = periodLabels[period] || period;

        // 买卖点提示
        const bsPoints = czsc.buy_sell_points || [];
        const bsDiv = document.getElementById('czsc-buy-sell-points');
        const bsDetail = document.getElementById('czsc-bs-points');
        if (bsPoints.length > 0) {
            bsDiv.style.display = 'block';
            bsDiv.className = 'alert alert-success';
            let bsHtml = '<div class="d-flex flex-wrap gap-2">';
            for (const bp of bsPoints) {
                const icon = bp.type.includes('买') ? '🟢' : '🔴';
                bsHtml += `<span class="badge bg-${bp.type.includes('买') ? 'success' : 'danger'} fs-6">${icon} ${bp.type} - ${bp.price}</span>`;
            }
            bsHtml += '</div>';
            bsDetail.innerHTML = bsHtml;
        } else {
            bsDiv.style.display = 'none';
        }

        // MACD背离提示
        const divergence = czsc.macd_divergence;
        const divDiv = document.getElementById('czsc-macd-divergence');
        const divDetail = document.getElementById('czsc-divergence-detail');
        if (divergence && divergence.type) {
            divDiv.style.display = 'block';
            const isBullish = divergence.type.includes('底');
            divDiv.className = `alert ${isBullish ? 'alert-success' : 'alert-warning'}`;
            divDetail.innerHTML = `
                <div class="d-flex justify-content-between align-items-center">
                    <span class="fs-5">${isBullish ? '📈' : '📉'} ${divergence.type}</span>
                    <span class="badge bg-${isBullish ? 'success' : 'warning'}">${divergence.strength}</span>
                </div>
                <small class="text-muted mt-1 d-block">${divergence.description}</small>
            `;
        } else {
            divDiv.style.display = 'none';
        }

        // 笔分析
        const bi = czsc.bi_analysis;
        if (bi && bi.latest) {
            const dir = bi.latest.direction;
            const dirColor = bi.latest.is_up ? 'up' : 'down';
            document.getElementById('czsc-bi').innerHTML = `
                <table class="table table-sm mb-0">
                    <tr><td>笔数量</td><td class="text-end fw-bold">${bi.count}</td></tr>
                    <tr><td>当前笔</td><td class="text-end ${dirColor}">${dir}</td></tr>
                    <tr><td>幅度</td><td class="text-end ${dirColor}">${(bi.latest.change_pct >= 0 ? '+' : '')}${bi.latest.change_pct.toFixed(1)}%</td></tr>
                    <tr><td>力度</td><td class="text-end">${bi.latest.power}</td></tr>
                    <tr><td>长度</td><td class="text-end">${bi.latest.length} 根 K 线</td></tr>
                    <tr><td>角度</td><td class="text-end">${bi.latest.angle}°</td></tr>
                    <tr><td>R² 拟合</td><td class="text-end">${bi.latest.rsq}</td></tr>
                </table>
            `;
        }

        // 分型分析
        const fx = czsc.fx_analysis;
        if (fx && fx.latest) {
            document.getElementById('czsc-fx').innerHTML = `
                <table class="table table-sm mb-0">
                    <tr><td>分型总数</td><td class="text-end fw-bold">${fx.count}</td></tr>
                    <tr><td>最新分型</td><td class="text-end">${fx.latest.type}</td></tr>
                    <tr><td>价格</td><td class="text-end">${fx.latest.price}</td></tr>
                </table>
            `;
        }

        // 趋势判断
        const tj = czsc.trend_judgment;
        if (tj) {
            const trendColors = {'强势上涨':'success','强势下跌':'danger','反弹':'warning','回调':'info','数据不足':'secondary','上涨结构':'success','下跌结构':'danger','收敛震荡':'secondary','横盘整理':'secondary','震荡':'secondary','趋势加速':'warning'};
            const color = trendColors[tj.trend] || 'secondary';
            document.getElementById('czsc-trend').innerHTML = `
                <div class="text-center mb-2">
                    <span class="badge bg-${color} fs-5">${tj.trend}</span>
                </div>
                <p class="small text-muted">${tj.description}</p>
                ${tj['3rd_buy'] ? '<div class="alert alert-success py-1"><small>🔔 第三类买点形成</small></div>' : ''}
                ${tj['3rd_sell'] ? '<div class="alert alert-danger py-1"><small>⚠️ 第三类卖点形成</small></div>' : ''}
            `;
        }

        // 信号
        const sigs = czsc.signals || [];
        if (sigs.length > 0) {
            let html = '<ul class="list-unstyled mb-0">';
            for (const s of sigs) {
                const badge = s.strength === 'strong' ? 'bg-success' : s.strength === 'warning' ? 'bg-warning' : s.strength === 'weak' ? 'bg-info' : 'bg-secondary';
                html += `<li class="mb-1"><span class="badge ${badge} me-1">${s.type}</span> ${s.msg}</li>`;
            }
            html += '</ul>';
            document.getElementById('czsc-signals').innerHTML = html;
        } else {
            document.getElementById('czsc-signals').innerHTML = '<div class="text-muted">暂无信号</div>';
        }

        // 总结
        const summary = czsc.summary;
        if (summary) {
            const trendLabels = {'bullish':'看多','bearish':'看空','neutral':'观望'};
            const recLabel = summary.recommendation || '观望';
            let html = `<div class="mb-2"><strong>总体趋势：</strong><span class="badge bg-${recLabel === '看多' ? 'success' : recLabel === '看空' ? 'danger' : 'secondary'}">${recLabel}</span></div>`;
            html += '<ul class="list-unstyled mb-0">';
            for (const p of (summary.key_points || [])) {
                html += `<li class="small mb-1">• ${p}</li>`;
            }
            html += '</ul>';
            document.getElementById('czsc-summary').innerHTML = html;
        }
    }

    function renderKlineChart(kline) {
        if (kline.length === 0) return;

        const dates = kline.map(d => d.date || d.datetime);
        const closes = kline.map(d => parseFloat(d.close));
        const opens = kline.map(d => parseFloat(d.open));
        const highs = kline.map(d => parseFloat(d.high));
        const lows = kline.map(d => parseFloat(d.low));
        const volumes = kline.map(d => parseFloat(d.volume || 0));

        const calcMA = (data, period) => {
            const result = [];
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) { result.push(null); continue; }
                let sum = 0;
                for (let j = i - period + 1; j <= i; j++) sum += data[j];
                result.push(sum / period);
            }
            return result;
        };

        const ma5 = calcMA(closes, 5);
        const ma20 = calcMA(closes, 20);

        if (klineChart) { klineChart.destroy(); }
        klineChart = new ApexCharts(document.getElementById('kline-chart'), {
            series: [
                { name: '收盘价', data: closes },
                { name: 'MA5', data: ma5 },
                { name: 'MA20', data: ma20 },
            ],
            chart: { type: 'line', height: 350, zoom: { enabled: true }, toolbar: { show: true }, animations: { enabled: false } },
            stroke: { width: [2, 1, 1], curve: 'smooth' },
            colors: ['#333', '#2196f3', '#ff9800'],
            xaxis: { categories: dates, labels: { rotate: -45, trim: true } },
            yaxis: { labels: { formatter: v => v.toFixed(2) } },
            tooltip: { shared: true },
            legend: { position: 'top' },
            markers: { size: 0 }
        });
        klineChart.render();
    }
    </script>
